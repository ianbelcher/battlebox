---
apiVersion: v1
kind: Namespace
metadata:
  name: world
---
# Game server (WebSocket). Native clients connect here:
#   ws://<node-ip>:30810
apiVersion: v1
kind: Service
metadata:
  name: world-server
  namespace: world
spec:
  ports:
    - name: game
      port: 9081
      targetPort: 9081
      nodePort: 30810
      protocol: TCP
  selector:
    app: world
  type: NodePort
---
# Downloads page (native client builds + instructions):
#   http://<node-ip>:30811
apiVersion: v1
kind: Service
metadata:
  name: world-web
  namespace: world
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30811
      protocol: TCP
  selector:
    app: world
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: world
  namespace: world
  labels:
    app: world
spec:
  replicas: 1
  revisionHistoryLimit: 0
  # Recreate, not RollingUpdate: two servers must never hold the world
  # data volume at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: world
  template:
    metadata:
      labels:
        app: world
    spec:
      nodeName: r710-2
      containers:
        # Both containers run the same image; the entrypoint argument picks
        # the role. The CI workflow updates both images together.
        - name: server
          image: 10.0.0.200:30435/world:latest
          args: ["server"]
          env:
            - name: WORLD_DATA_DIR
              value: /data
            # To play inside the family's real Minecraft world instead of the
            # procedural island, switch these on (the minecraft volume below
            # is already mounted read-only) and restart the pod:
            #   WORLD_SOURCE:  mca
            #   WORLD_MCA_DIR: /minecraft/world_belchercury
            # Optional tuning: WORLD_MCA_Y0 (default 40) picks which Minecraft
            # y becomes the world floor; WORLD_MCA_CENTER="x,z" recenters the
            # spawn on the kids' base. Godot-side edits are stored as an
            # overlay in /data — the Minecraft save is never written.
            - name: WORLD_SOURCE
              value: procedural
          ports:
            - containerPort: 9081
          volumeMounts:
            - mountPath: /data
              name: world-data
            - mountPath: /minecraft
              name: minecraft-data
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
        - name: web
          image: 10.0.0.200:30435/world:latest
          args: ["web"]
          ports:
            - containerPort: 8081
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
      volumes:
        - name: world-data
          persistentVolumeClaim:
            claimName: world-data
        # The Minecraft server's world lives on the same NAS; mounting it
        # read-only lets the importer stream the family's real builds.
        - name: minecraft-data
          nfs:
            server: 10.0.0.215
            path: "/data-pool/services/minecraft/data"
            readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: world-data
  namespace: world
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
# NOTE: create the export directory on the NAS before the first apply:
#   mkdir -p /data-pool/services/world/data  (on 10.0.0.215)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: world-data
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Delete
  claimRef:
    name: world-data
    namespace: world
  nfs:
    server: 10.0.0.215
    path: "/data-pool/services/world/data"
