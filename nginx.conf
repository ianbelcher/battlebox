user www-data;
worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Logs go to the container's stdout/stderr so `docker compose logs`
    # is the whole story; a file inside the container would be invisible.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # The browser build is ~60 MB of wasm and pack file. Compressing it on
    # the way out roughly quarters the wasm, which is the difference
    # between a tolerable first load and a child wandering off.
    #
    # This is the ONLY thing that compresses: the TLS terminator in front
    # passes an already-encoded body straight through, and re-compressing
    # would cost CPU for nothing.
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 4096;
    gzip_proxied any;
    gzip_vary on;
    # text/html is always gzipped and naming it again is a warning.
    gzip_types application/wasm application/javascript text/css
               application/octet-stream image/svg+xml;

    client_max_body_size 1m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # -------------------------------------------------------------------
    # Everything is served here, on plain http, on one port.
    #
    # This container is NEVER exposed to the internet directly. A TLS
    # terminator (Caddy, see deploy/Caddyfile) sits in front of it holding
    # the real battlebox.games certificate, and Cloudflare sits in front of
    # that. The browser therefore sees https, which is what actually
    # matters — see the Cross-Origin-* note below.
    # -------------------------------------------------------------------
    server {
        listen 8081;
        root /opt/battlebox/web;
        index index.html;

        # What the deploy script polls after `docker compose up` to decide
        # whether the new image really came up, rather than assuming it.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # The native client builds. Big, and they change under the SAME
        # names every release, so a cached copy is a WRONG copy.
        # "no-cache" is not "no-store": it lets the browser keep the file
        # and revalidate, so an unchanged build costs a 304 instead of
        # 60 MB, while a changed one can never be served stale.
        location /downloads/ {
            autoindex off;
            add_header Cache-Control "no-cache" always;
        }

        location = /play {
            return 301 /play/;
        }

        # The game itself.
        #
        # The two Cross-Origin-* headers are what make the page "cross-origin
        # isolated", which is the only state in which a browser hands out
        # SharedArrayBuffer. Godot's threaded build meshes voxel chunks on
        # real threads and needs it: without these headers the game
        # downloads in full and then dies on startup.
        #
        # They only count in a secure context, which is why the terminator
        # in front is load-bearing rather than decoration. Reaching this
        # container over plain http (a LAN test, a port-forward) gets you a
        # game that loads and then fails — that is expected, not a bug.
        location /play/ {
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy same-origin always;
            # Same reasoning as downloads: stable filenames, new content
            # every deploy. A cached wasm against a new pack file fails in
            # ways nobody could diagnose.
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /play/index.html;
        }

        # The game server, same origin as the page.
        #
        # Same origin is not tidiness. A page served over https cannot open
        # a plain ws:// socket at all (mixed content, blocked silently), and
        # the game server speaks plain WebSocket — so the only way a browser
        # can reach it is through a terminator, on the page's own origin.
        # The server container shares this container's network namespace,
        # so this is a loopback hop.
        location /ws {
            proxy_pass http://127.0.0.1:9081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Chunk bursts on join are large and latency matters more than
            # throughput here; let them straight through.
            proxy_buffering off;
        }

        # The entry page changes every deploy too, and it is small.
        location / {
            add_header Cache-Control "no-cache" always;
        }
    }
}
