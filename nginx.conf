user www-data;
worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # The browser build is ~60 MB of wasm and pack file. Compressing it on
    # the way out roughly quarters the wasm, which is the difference
    # between a tolerable first load and a child wandering off.
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 4096;
    gzip_proxied any;
    # text/html is always gzipped and naming it again is a warning.
    gzip_types application/wasm application/javascript text/css
               application/octet-stream image/svg+xml;

    # Uploading a 60 MB build is not what this serves, but the browser
    # asking for it must not be cut off mid-download on a slow laptop.
    client_max_body_size 1m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # -------------------------------------------------------------------
    # Plain http: the downloads page and the native client builds. This is
    # what it has always served and native players still use it.
    # -------------------------------------------------------------------
    server {
        listen 8081;
        root /opt/world/web;
        index index.html;

        # The client builds are big; let nginx stream them efficiently.
        location /downloads/ {
            autoindex off;
            # Builds change under the same names: never let a stale copy
            # be cached by browsers or proxies.
            add_header Cache-Control "no-store";
        }

        # Playing in the browser needs a secure context (see below), which
        # plain http can never be. Rather than serve a version that loads
        # and then fails in a confusing way, send people to the https one.
        location /play {
            return 302 https://$host:30812/play/;
        }
    }

    # -------------------------------------------------------------------
    # https: the browser game. Self-signed, so everyone clicks through a
    # warning the first time.
    #
    # Two things about this server are load-bearing and look optional:
    #
    #  1. The websocket is proxied HERE, on the same port as the page,
    #     rather than dialled directly on 30810. A browser only ever
    #     offers the "accept this certificate" click for a page it is
    #     navigating to. A websocket to any other origin is refused
    #     outright with no prompt — the game would sit forever on
    #     "Finding the world…" with nothing to click. Same origin means
    #     one acceptance covers both.
    #  2. The two Cross-Origin-* headers below are what make the page
    #     "cross-origin isolated", which is the only state in which a
    #     browser hands out SharedArrayBuffer. Godot's threaded build
    #     meshes voxel chunks on real threads and needs it: without these
    #     headers the game downloads in full and then dies on startup.
    # -------------------------------------------------------------------
    server {
        # No "http2 on;" here. That directive only exists in nginx 1.25.1
        # and later, and this image is Ubuntu 24.04, which ships 1.24 —
        # where it is an unknown directive, so nginx refuses to start at
        # all. That took the whole deployment down once: the web container
        # crash-looped, which made the POD unready, which pulled the game
        # server's endpoint out of its Service too. HTTP/1.1 is fine for a
        # handful of large files. The `nginx -t` in the Dockerfile now
        # catches this at build time rather than in production.
        listen 8443 ssl;

        ssl_certificate     /opt/world/tls/world.crt;
        ssl_certificate_key /opt/world/tls/world.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:2m;

        root /opt/world/web;
        index index.html;

        location /downloads/ {
            autoindex off;
            add_header Cache-Control "no-store";
        }

        # The game itself.
        location /play/ {
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy same-origin always;
            # Same reason as downloads: the build changes under the same
            # names every deploy, and a cached wasm against a new pack
            # file fails in ways nobody could diagnose.
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /play/index.html;
        }

        # The game server, same origin as the page. Both containers are in
        # one pod, so this is a loopback hop.
        location /ws {
            proxy_pass http://127.0.0.1:9081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            # Chunk bursts on join are large and latency matters more than
            # throughput here; let them straight through.
            proxy_buffering off;
        }
    }
}
