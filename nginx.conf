user www-data;
worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 8081;
        root /opt/world/web;
        index index.html;

        # The client builds are big; let nginx stream them efficiently.
        location /downloads/ {
            autoindex off;
        }
    }
}
